[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fretpilot"
version = "2.0.0"
description = "BandPilot v2 — repair AI-generated guitar and drum MIDI into notatable output."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "FretPilot Team" }]

dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    # MIDI / score
    "mido>=1.3.0",
    "PyGuitarPro>=0.9.0",
    # Database
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    # Auth / crypto
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",
    # LLM client
    "httpx>=0.27.0",
    # Validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.2.0",
    # Schema migrations
    "alembic>=1.13.0",
    "filelock>=3.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.12.0",
    "pytest-cov>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fretpilot = [
    "knowledge/assets/*.json",
    "knowledge/version_manifest.json",
    "knowledge/versions/**/*.json",
    "exporters/ample_midi/profiles/*.json",
    "db/migrations/*.py",
    "db/migrations/script.py.mako",
    "db/migrations/versions/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "--strict-markers"
markers = [
    "external_fixture: requires an opt-in local test corpus",
]

[tool.coverage.run]
source = ["fretpilot"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    # FastAPI dependency injection intentionally evaluates these declarations.
    "B008",
]
